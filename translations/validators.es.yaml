"Ce champ est obligatoire.": "Este campo es obligatorio."
"Cette adresse e-mail n'est pas valide.": "Este correo electrónico no es válido."
"Cette case doit être cochée pour valider la commande.": "Debe marcar esta casilla para confirmar el pedido."
"Choisissez un mode de paiement.": "Elija una forma de pago."
