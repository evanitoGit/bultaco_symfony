# Messages de validation des formulaires du site, en espagnol (clé = message français)
"Ce champ est obligatoire.": "Este campo es obligatorio."
"Cette adresse e-mail n'est pas valide.": "Este correo electrónico no es válido."
"Cette case doit être cochée pour valider la commande.": "Debe marcar esta casilla para confirmar el pedido."
"Choisissez un mode de paiement.": "Elija una forma de pago."
"Choisissez un mot de passe.": "Elija una contraseña."
"Cochez cette case pour confirmer.": "Marque esta casilla para confirmar."
"Indiquez votre adresse e-mail.": "Indique su correo electrónico."
"Indiquez votre nouvelle adresse e-mail.": "Indique su nuevo correo electrónico."
"Le mot de passe actuel est incorrect.": "La contraseña actual es incorrecta."
"Le mot de passe doit contenir au moins {{ limit }} caractères.": "La contraseña debe tener al menos {{ limit }} caracteres."
"Le mot de passe est incorrect.": "La contraseña es incorrecta."
"Les deux mots de passe ne correspondent pas.": "Las dos contraseñas no coinciden."
"Un compte existe déjà avec cette adresse e-mail.": "Ya existe una cuenta con este correo electrónico."
